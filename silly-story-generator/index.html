<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<title>Generatore di storia</title>
<style>
 * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
 }
 body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 30px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
 }
 .container {
    width: 100%;
    max-width: 700px;
    background: white;
    padding: 40px;
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    display: flex;
    flex-direction: column;
    align-items: center;
 }
 h1 {
    text-align: center;
    color: #333;
    margin-bottom: 30px;
    font-size: 2.2em;
 }
 fieldset {
    border: none;
    margin: 20px 0;
    padding: 0;
    width: 100%;
    text-align: center;
 }
 legend {
    font-size: 1.1em;
    font-weight: bold;
    color: #333;
    margin-bottom: 10px;
 }
 .radio-group {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin: 10px 0;
 }
 input[type="text"],
 input[type="number"],
 input[type="color"] {
    margin: 8px 0;
    padding: 10px;
    width: 200px;
    border: 2px solid #e0e0e0;
    border-radius: 5px;
    font-size: 1em;
 }
 input[type="radio"] {
    cursor: pointer;
    width: 18px;
    height: 18px;
 }
 label {
    font-size: 1em;
    color: #555;
    cursor: pointer;
 }
 button {
    margin: 10px 0;
    padding: 10px 20px;
    background: #667eea;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 1em;
    font-weight: bold;
    cursor: pointer;
 }
 button:hover {
    background: #764ba2;
 }
 button.reset {
    background: #f5576c;
 }
 button.reset:hover {
    background: #d63447;
 }
 .story {
    margin-top: 20px;
    background: #ffffa3;
    padding: 25px;
    border-radius: 8px;
    visibility: hidden;
    line-height: 1.6;
    border-left: 5px solid #667eea;
    font-size: 16px;
    width: 100%;
 }
 .highlight {
    background-color: #ff6b6b;
    color: white;
    font-weight: bold;
    padding: 2px 4px;
    border-radius: 3px;
 }
 #search-input {
    width: 200px;
 }
 input[type="color"] {
    width: 80px;
    height: 45px;
    padding: 2px;
    cursor: pointer;
 }
 .row {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
 }
</style>
</head>
<body>
<div class="container">

  <div class="row">
    <label for="custom-name">Enter custom name:</label>
    <input id="custom-name" type="text" />
  </div>

  <fieldset>
    <legend>Choose locale:</legend>
    <div class="radio-group">
      <input id="us" type="radio" name="uk-us" value="us" checked />
      <label for="us">US</label>
      <input id="uk" type="radio" name="uk-us" value="uk" />
      <label for="uk">UK</label>
    </div>
  </fieldset>

  <div class="row">
    <button class="generate">Generate random story</button>
    <button class="reset">Reset</button>
  </div>

  <div class="row">
    <label for="font-size">Font Size:</label>
    <input id="font-size" type="number" value="16" />
  </div>

  <div class="row">
    <label for="shift">Shift:</label>
    <input id="shift" type="number" value="1" />
  </div>

  <div class="row">
    <button class="save">Save Story</button>
    <button class="encrypt">Encrypt Story</button>
  </div>

  <div class="row">
    <span class ="search-word">Search word:</span>
    <input id="search-input" type="text" />
    <button id="search-btn">Search</button>
  </div>

  <input id="color-picker" type="color" value="#ffffa3">

  <p class="story"></p>

</div>

<script>
const customName = document.getElementById("custom-name");
const generateBtn = document.querySelector(".generate");
const resetBtn = document.querySelector(".reset");
const saveBtn = document.querySelector(".save");
const encryptBtn = document.querySelector(".encrypt");
const story = document.querySelector(".story");
const fontSizeInput = document.getElementById("font-size");
const shiftInput = document.getElementById("shift");
const searchInput = document.getElementById("search-input");
const searchBtn = document.getElementById("search-btn");
const colorPicker = document.getElementById("color-picker");

function randomValueFromArray(array) {
  const random = Math.floor(Math.random() * array.length);
  return array[random];
}

const characters = ["Willy the Goblin", "Big Daddy", "Father Christmas"];
const places = ["the soup kitchen", "Disneyland", "the White House"];
const events = ["spontaneously combusted","melted into a puddle on the sidewalk","turned into a slug and slithered away"];

function returnRandomStoryString() {
  const randomCharacter = randomValueFromArray(characters);
  const randomPlace = randomValueFromArray(places);
  const randomEvent = randomValueFromArray(events);
  let storyText = `It was 94 Fahrenheit outside, so ${randomCharacter} went for a walk. When they got to ${randomPlace}, they stared in horror for a few moments, then ${randomEvent}. Bob saw the whole thing, but was not surprised — ${randomCharacter} weighs 300 pounds, and it was a hot day.`;
  return storyText;
}

generateBtn.addEventListener("click", generateStory);

customName.addEventListener("keypress", (e) => {
  if (e.key === "Enter") generateStory();
});

function generateStory() {
  let newStory = returnRandomStoryString();
  if (customName.value !== "") newStory = newStory.replace("Bob", customName.value);
  if (document.getElementById("uk").checked) {
    const weight = `${Math.round(300 / 14)} stone`;
    const temperature = `${Math.round((94 - 32) * (5 / 9))} Celsius`;
    newStory = newStory.replace("300 pounds", weight);
    newStory = newStory.replace("94 Fahrenheit", temperature);
  }
  story.textContent = newStory;
  story.style.visibility = "visible";
  story.style.fontSize = `${fontSizeInput.value}px`;
}

colorPicker.addEventListener("input", () => {
  story.style.backgroundColor = colorPicker.value;
});

fontSizeInput.addEventListener("input", () => {
  story.style.fontSize = `${fontSizeInput.value}px`;
});

function caesarShiftChar(ch, shift) {
  const code = ch.charCodeAt(0);
  if (code >= 65 && code <= 90) return String.fromCharCode(((code - 65 + shift) % 26 + 26) % 26 + 65);
  if (code >= 97 && code <= 122) return String.fromCharCode(((code - 97 + shift) % 26 + 26) % 26 + 97);
  return ch;
}

function storyEncryption () {
  const shift = parseInt(shiftInput.value, 10) || 0;
  const text = story.textContent || "";
  let encryptedText = '';
  for (let i = 0; i < text.length; i++) encryptedText += caesarShiftChar(text[i], shift);
  story.textContent = encryptedText;
}

encryptBtn.addEventListener('click', storyEncryption);

shiftInput.addEventListener("keypress", (e) => {
  if (e.key === "Enter") storyEncryption();
});

saveBtn.addEventListener('click', () => {
  const text = story.textContent;
  if (text) {
    const fileName = prompt('Enter a name for your story file:', 'my-story.txt');
    if (fileName) saveTexttoFile(text, fileName);
  }
});

resetBtn.addEventListener('click', () => {
  customName.value = '';
  document.getElementById('us').checked = true;
  fontSizeInput.value = '16';
  shiftInput.value = '1';
  colorPicker.value = '#ffffa3';
  story.style.backgroundColor = '#ffffa3';
  story.style.visibility = 'hidden';
  story.textContent = '';
});

function saveTexttoFile(text, filename) {
  const blob = new Blob([text], { type: 'text/plain' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = filename;
  link.click();
  URL.revokeObjectURL(link.href);
}

searchBtn.addEventListener('click', searchWord);

searchInput.addEventListener("keypress", (e) => {
  if (e.key === "Enter") searchWord();
});

function searchWord() {
  const searchTerm = searchInput.value.trim();
  const text = story.textContent;
  if (!searchTerm || !text) return;
  const regex = new RegExp('\\b' + searchTerm + '\\b', 'gi');
  const matches = text.match(regex);
  if (!matches) {
    story.innerHTML = text;
  } else {
    const highlightedText = text.replace(regex, m => `<span class="highlight">${m}</span>`);
    story.innerHTML = highlightedText;
  }
}
</script>
</body>
</html>
