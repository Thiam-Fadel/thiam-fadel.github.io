<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
  body {
    font-family: sans-serif;
    margin: 0;
    background-color: #f0f0f0;
  }
  .container {
    width: 800px;
    margin: 1em auto 0 auto;
    display: flex;
    flex-wrap: wrap;
    padding: 0;
  }
  .container > div {
    box-sizing: border-box;
    width: 50%;
    background-color: red;
    border: 2px solid green;
    border-radius: 8px;
    padding: 20px;
    text-align: center;
   
  }
</style>
</head>
<body>
<header>
  <div class="container">
    <div>Primo</div>
    <div>Secondo</div>
    <div>Terzo</div>
    <div>Quarto</div>
    <div>Quinto</div>
    <div>Sesto</div>
    <div>Settimo</div>
  </div>
</header>
</body>
</html>
